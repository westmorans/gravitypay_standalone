<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk STK Push Bot Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 1.5rem;
        }
        h2 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 1.4rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.75rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea { resize: vertical; height: 100px; }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        button {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--accent-hover); }
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .status-box {
            background: #0f172a;
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
        }
        .alert {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            display: none;
        }
        .alert.success { background-color: rgba(16, 185, 129, 0.2); border: 1px solid var(--accent); color: #34d399; }
        .alert.error { background-color: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #f87171; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.875rem;
        }
        th, td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--text-muted); background: #0f172a; }
        .badge-success { color: #34d399; font-weight: bold; }
        .badge-failed { color: #f87171; font-weight: bold; }
        pre { background: #0f172a; padding: 0.5rem; border-radius: 4px; overflow-x: auto; margin: 0; font-size: 0.75rem; color: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Bot Dashboard Status</h2>
        <div class="status-grid">
            <div class="status-box">
                <div>Queue Pending: <span id="queueCount" style="font-weight:bold; color:var(--accent);">0</span></div>
            </div>
            <div class="status-box">
                <div>Worker Status: <span id="workerStatus" style="font-weight:bold; color:var(--text-muted);">Idle</span></div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Queue Bulk STK Push</h2>
        <form id="stkForm">
            <div class="form-group">
                <label for="phoneNumbers">Phone Numbers (Paste multiple, one per line or comma-separated)</label>
                <textarea id="phoneNumbers" placeholder="254712345678&#10;254798765432&#10;254700112233" required></textarea>
            </div>
            <div class="form-group">
                <label for="amount">Amount (KES - Applied to all)</label>
                <input type="number" id="amount" placeholder="1000" required>
            </div>
            <div class="form-group">
                <label for="reference">Reference Prefix (Optional)</label>
                <input type="text" id="reference" placeholder="INV-CHECKOUT">
            </div>
            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <input type="text" id="description" placeholder="Retail Checkout">
            </div>
            <button type="submit">Queue All Numbers (6s Paced Interval)</button>
        </form>
        <div id="responseAlert" class="alert"></div>
    </div>

    <div class="card">
        <h2>Dispatch Activity Log & Response Details</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Phone</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>API Response / Details</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <tr><td colspan="5" style="text-align:center; color:var(--text-muted);">No activity recorded yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function fetchStatus() {
        try {
            const res = await fetch('/api/v1/status');
            const data = await res.json();
            
            document.getElementById('queueCount').innerText = data.queueLength;
            document.getElementById('workerStatus').innerText = data.isProcessing ? 'Processing (6s Interval)' : 'Idle';
            document.getElementById('workerStatus').style.color = data.isProcessing ? '#10b981' : '#94a3b8';

            const tbody = document.getElementById('historyTableBody');
            if (data.history && data.history.length > 0) {
                tbody.innerHTML = data.history.map(item => `
                    <tr>
                        <td>${new Date(item.processedAt).toLocaleTimeString()}</td>
                        <td>${item.phoneNumber}</td>
                        <td>KES ${item.amount}</td>
                        <td><span class="${item.status === 'SUCCESS' ? 'badge-success' : 'badge-failed'}">${item.status}</span></td>
                        <td><pre>${JSON.stringify(item.responsePayload || item.errorDetails, null, 2)}</pre></td>
                    </tr>
                `).join('');
            }
        } catch (e) {
            console.error('Failed to fetch status', e);
        }
    }

    setInterval(fetchStatus, 3000);
    fetchStatus();

    document.getElementById('stkForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('responseAlert');
        
        const payload = {
            phoneNumbers: document.getElementById('phoneNumbers').value,
            amount: document.getElementById('amount').value,
            reference: document.getElementById('reference').value,
            description: document.getElementById('description').value
        };

        try {
            const res = await fetch('/api/v1/queue-stk', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok) {
                alertBox.className = 'alert success';
                alertBox.innerText = data.message;
                alertBox.style.display = 'block';
                document.getElementById('stkForm').reset();
                fetchStatus();
            } else {
                throw new Error(data.error || 'Failed to queue requests');
            }
        } catch (err) {
            alertBox.className = 'alert error';
            alertBox.innerText = err.message;
            alertBox.style.display = 'block';
        }
    });
</script>
</body>
</html>
